server {
    listen 80;
    server_name _;
 
    root /usr/share/nginx/html;
    index index.html;
 
    location / {
        try_files $uri $uri/ /index.html;
    }
 
    location /api/upload {
        proxy_pass http://backend-service.rag-app.svc.cluster.local:8000/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
 
    location /api/ask {
        proxy_pass http://backend-service.rag-app.svc.cluster.local:8000/ask;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
